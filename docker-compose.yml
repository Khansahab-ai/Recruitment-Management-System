services:
  db:
    image: postgres:16
    container_name: recruitment_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recruitment_user
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: recruitment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment_user -d recruitment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    container_name: recruitment_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://recruitment_user:dev_password_123@db:5432/recruitment_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
    container_name: recruitment_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
